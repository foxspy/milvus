syntax = "proto3";
package milvus.proto.clustering;

option go_package = "github.com/milvus-io/milvus/pkg/v3/proto/clusteringpb";
import "schema.proto";

// Synchronously modify StorageConfig in index_coord.proto/index_cgo_msg.proto file
message StorageConfig {
  string address = 1;
  string access_keyID = 2;
  string secret_access_key = 3;
  bool useSSL = 4;
  string bucket_name = 5;
  string root_path = 6;
  bool useIAM = 7;
  string IAMEndpoint = 8;
  string storage_type = 9;
  bool use_virtual_host = 10;
  string region = 11;
  string cloud_provider = 12;
  int64 request_timeout_ms = 13;
  string sslCACert = 14;
  string GcpCredentialJSON = 15;
  uint32 max_connections = 16;
  string ssl_tls_min_version = 17;
  bool use_crc32c_checksum = 18;
}

message InsertFiles {
  repeated string insert_files = 1;
}

message FieldInsertFiles {
  repeated string file_paths = 1;
}

message SegmentInsertFiles {
  repeated FieldInsertFiles field_insert_files = 1;
}

message SegmentStorageInfo {
  int64 storage_version = 1;
  SegmentInsertFiles segment_insert_files = 2;
  string manifest = 3;
}

message AnalyzeInfo {
  string clusterID = 1;
  int64 buildID = 2;
  int64 collectionID = 3;
  int64 partitionID = 4;
  int64 segmentID = 5;
  int64 version = 6;
  int64 dim = 7;
  int64 num_clusters = 8;
  int64 train_size = 9;
  double min_cluster_ratio = 10;  // min_cluster_size / avg_cluster_size < min_cluster_ratio, is skew
  double max_cluster_ratio = 11;  // max_cluster_size / avg_cluster_size > max_cluster_ratio, is skew
  int64 max_cluster_size = 12;
  map<int64, InsertFiles> insert_files = 13;
  map<int64, int64> num_rows = 14;
  schema.FieldSchema field_schema = 15;
  StorageConfig storage_config = 16;
  bool enable_global_index = 17;
  string insert_channel = 18;
  string global_stats_index_root = 19;
  string head_index_path = 20;
  string chunk_mapping_path = 21;
  string compaction_plan_path = 22;
  string global_train_method = 23;
  string global_assign_method = 24;
  int64 compaction_max_rows = 25;
  int64 compaction_min_rows = 26;
  int64 kmeans_max_iter = 27;
  int64 kmeans_random_state = 28;
  int64 kmeans_fast_mode = 29;
  double kmeans_fast_epsilon = 30;
  map<int64, SegmentStorageInfo> segment_storage_infos = 31;
  map<string, string> cluster_params = 32; // knowhere.cluster.* pass-through; overrides cardinal defaults
}

message ClusteringCentroidsStats {
  repeated schema.VectorField centroids = 1;
}

message ClusteringCentroidIdMappingStats {
  repeated uint32 centroid_id_mapping = 1;
  repeated int64 num_in_centroid = 2;
  repeated float distance_to_centroid = 3;
}
