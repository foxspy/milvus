syntax = "proto3";
package milvus.proto.clustering;

option go_package = "github.com/milvus-io/milvus/pkg/v2/proto/clusteringpb";
import "schema.proto";

// Synchronously modify StorageConfig in index_coord.proto/index_cgo_msg.proto file
message StorageConfig {
  string address = 1;
  string access_keyID = 2;
  string secret_access_key = 3;
  bool useSSL = 4;
  string bucket_name = 5;
  string root_path = 6;
  bool useIAM = 7;
  string IAMEndpoint = 8;
  string storage_type = 9;
  bool use_virtual_host = 10;
  string region = 11;
  string cloud_provider = 12;
  int64 request_timeout_ms = 13;
  string sslCACert = 14;
  string GcpCredentialJSON = 15;
  uint32 max_connections = 16;
  string ssl_tls_min_version = 17;
  bool use_crc32c_checksum = 18;
}

message InsertFiles {
  repeated string insert_files = 1;
  // StorageV2 manifest file path for this segment. When present, C++ side resolves
  // binlog paths from the manifest rather than the legacy insert_files list.
  string manifest_path = 2;
}

message AnalyzeInfo {
  string clusterID = 1;
  int64 buildID = 2;
  int64 collectionID = 3;
  int64 partitionID = 4;
  int64 segmentID = 5;
  int64 version = 6;
  int64 dim = 7;
  int64 num_clusters = 8;
  int64 train_size = 9;
  double min_cluster_ratio = 10;  // min_cluster_size / avg_cluster_size < min_cluster_ratio, is skew
  double max_cluster_ratio = 11;  // max_cluster_size / avg_cluster_size > max_cluster_ratio, is skew
  int64 max_cluster_size = 12;
  map<int64, InsertFiles> insert_files = 13;
  map<int64, int64> num_rows = 14;
  schema.FieldSchema field_schema = 15;
  StorageConfig storage_config = 16;
  // Storage version: 0=V1(legacy binlog), 2=V2(packed parquet), 3=V3(loon manifest).
  // When >= 2, KmeansClustering reads raw data via per-segment manifest paths
  // instead of the legacy insert_files list.
  int64 storage_version = 17;
  // Optional: minio object path to a pre-computed centroids file.
  // When non-empty, analyze skips the kmeans Fit step, loads centroids from
  // this file via ClusterNode::SetCentroids, and runs streaming assign for
  // every segment (no trained_segments_num shortcut).
  // File format (simple binary): int32 n_clusters | int32 dim | float32[n×dim]
  string external_centroids_path = 18;
}

message ClusteringCentroidsStats {
  repeated schema.VectorField centroids = 1;
}

message ClusteringCentroidIdMappingStats {
  repeated uint32 centroid_id_mapping = 1;
  repeated int64 num_in_centroid = 2;
}
